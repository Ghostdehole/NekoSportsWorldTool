name: Publish Route Workbench

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-route-workbench.yml'
      - '.github/scripts/publish-route-workbench.sh'
      - 'docs/releases/route-workbench-v0.1.0.md'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-route-workbench-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Ghostdehole/NekoSportsWorldTool'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested package and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-route-workbench.sh
